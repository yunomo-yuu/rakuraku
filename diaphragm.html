<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>横隔膜トレーニング ｜ 結ゆう・整う部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#070a16}
  #root{min-height:100vh}
  #backlink{position:fixed;top:14px;left:16px;z-index:9999;
    font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:.18em;
    color:rgba(232,200,119,.7);text-decoration:none;
    border:1px solid rgba(232,200,119,.22);border-radius:999px;
    padding:6px 14px;background:rgba(7,10,22,.55);backdrop-filter:blur(4px);}
  #backlink:hover{color:#FFD580;border-color:rgba(232,200,119,.5)}
</style>
</head>
<body>
<a id="backlink" href="totonou.html">← 整う部屋</a>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;


const SOUNDS = [
  { kana: "ひ", beats: 8, color: "#7AE8A0", glow: "rgba(122,232,160,0.3)" },
  { kana: "へ", beats: 8, color: "#FFB347", glow: "rgba(255,179,71,0.3)" },
  { kana: "は", beats: 4, color: "#FF6B6B", glow: "rgba(255,107,107,0.3)" },
  { kana: "ほ", beats: 4, color: "#7AC8FF", glow: "rgba(122,200,255,0.3)" },
  { kana: "ふ", beats: 4, color: "#C084FC", glow: "rgba(192,132,252,0.3)" },
];

// ソから1オクターブ上がって戻る 15ループ
const SCALE = [
  { note: "ソ", freq: 392, label: "G4" },
  { note: "ラ", freq: 440, label: "A4" },
  { note: "シ", freq: 494, label: "B4" },
  { note: "ド", freq: 523, label: "C5" },
  { note: "レ", freq: 587, label: "D5" },
  { note: "ミ", freq: 659, label: "E5" },
  { note: "ファ", freq: 698, label: "F5" },
  { note: "ソ", freq: 784, label: "G5" },
  { note: "ファ", freq: 698, label: "F5" },
  { note: "ミ", freq: 659, label: "E5" },
  { note: "レ", freq: 587, label: "D5" },
  { note: "ド", freq: 523, label: "C5" },
  { note: "シ", freq: 494, label: "B4" },
  { note: "ラ", freq: 440, label: "A4" },
  { note: "ソ", freq: 392, label: "G4" },
];

const TOTAL_LOOPS = SCALE.length; // 15

function HahehiApp() {
  const [bpm, setBpm] = useState(120);
  const [running, setRunning] = useState(false);
  const [loopIdx, setLoopIdx] = useState(0);       // 0-14
  const [soundIdx, setSoundIdx] = useState(0);      // 0-4
  const [beat, setBeat] = useState(0);              // 現在の音内beat
  const [flash, setFlash] = useState(false);
  const [metroVol, setMetroVol] = useState(0.4);
  const [guideVol, setGuideVol] = useState(0.5);
  const [done, setDone] = useState(false);

  const audioCtxRef = useRef(null);
  const intervalRef = useRef(null);
  const stateRef = useRef({ loopIdx: 0, soundIdx: 0, beat: 0 });
  const metroVolRef = useRef(metroVol);
  const guideVolRef = useRef(guideVol);
  const bpmRef = useRef(bpm);

  useEffect(() => { metroVolRef.current = metroVol; }, [metroVol]);
  useEffect(() => { guideVolRef.current = guideVol; }, [guideVol]);
  useEffect(() => { bpmRef.current = bpm; }, [bpm]);

  function getCtx() {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtxRef.current;
  }

  function playClick(isFirst) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = isFirst ? 1400 : 900;
      const vol = metroVolRef.current;
      gain.gain.setValueAtTime(isFirst ? vol : vol * 0.6, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.07);
    } catch (e) {}
  }

  function playGuide(freq) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      const vol = guideVolRef.current;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.6);
    } catch (e) {}
  }

  const tick = useCallback(() => {
    const { loopIdx: li, soundIdx: si, beat: b } = stateRef.current;
    const isFirstBeat = b === 0 && si === 0;
    const isNewSound = b === 0;

    setFlash(true);
    setTimeout(() => setFlash(false), 80);
    playClick(isNewSound);

    // ループの最初の拍だけガイド音
    if (isFirstBeat) {
      playGuide(SCALE[li].freq);
    }

    const currentSound = SOUNDS[si];
    const nextBeat = b + 1;

    if (nextBeat >= currentSound.beats) {
      const nextSi = si + 1;
      if (nextSi >= SOUNDS.length) {
        // ループ完了
        const nextLi = li + 1;
        if (nextLi >= TOTAL_LOOPS) {
          // 全完了！
          stateRef.current = { loopIdx: 0, soundIdx: 0, beat: 0 };
          setRunning(false);
          setDone(true);
          if (intervalRef.current) clearInterval(intervalRef.current);
        } else {
          stateRef.current = { loopIdx: nextLi, soundIdx: 0, beat: 0 };
          setLoopIdx(nextLi);
          setSoundIdx(0);
          setBeat(0);
        }
      } else {
        stateRef.current = { loopIdx: li, soundIdx: nextSi, beat: 0 };
        setSoundIdx(nextSi);
        setBeat(0);
      }
    } else {
      stateRef.current = { loopIdx: li, soundIdx: si, beat: nextBeat };
      setBeat(nextBeat);
    }
  }, []);

  function start() {
    stateRef.current = { loopIdx: 0, soundIdx: 0, beat: 0 };
    setLoopIdx(0);
    setSoundIdx(0);
    setBeat(0);
    setDone(false);
    setRunning(true);
  }

  function stop() {
    setRunning(false);
    if (intervalRef.current) clearInterval(intervalRef.current);
  }

  useEffect(() => {
    if (running) {
      const ms = (60 / bpm) * 1000;
      tick();
      intervalRef.current = setInterval(tick, ms);
    } else {
      if (intervalRef.current) clearInterval(intervalRef.current);
    }
    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [running, bpm, tick]);

  const current = SOUNDS[soundIdx];
  const currentScale = SCALE[loopIdx];

  // スケール進捗バー
  const scaleProgress = loopIdx / TOTAL_LOOPS;

  return (
    <div style={{
      minHeight: "100vh",
      background: "#060810",
      display: "flex",
      flexDirection: "column",
      alignItems: "center",
      justifyContent: "center",
      fontFamily: "'Hiragino Mincho ProN', 'Yu Mincho', serif",
      padding: "20px 16px",
      userSelect: "none",
      position: "relative",
      overflow: "hidden",
    }}>
      {/* 背景グロー */}
      {running && (
        <div style={{
          position: "fixed",
          top: "50%", left: "50%",
          transform: "translate(-50%, -50%)",
          width: 500, height: 500,
          borderRadius: "50%",
          background: current.glow,
          filter: "blur(90px)",
          opacity: flash ? 0.9 : 0.3,
          transition: "opacity 0.05s",
          pointerEvents: "none",
        }} />
      )}

      {/* ヘッダー */}
      <p style={{ color: "#333", fontSize: 10, letterSpacing: "0.3em", marginBottom: 4 }}>彩花メソッド</p>
      <h1 style={{ color: "#fff", fontSize: 16, fontWeight: 400, letterSpacing: "0.3em", marginBottom: 20 }}>
        横隔膜トレーニング
      </h1>

      {/* 音階表示 */}
      <div style={{
        display: "flex",
        gap: 4,
        marginBottom: 16,
        alignItems: "flex-end",
      }}>
        {SCALE.map((s, i) => {
          const isActive = running && i === loopIdx;
          const isDone = running && i < loopIdx;
          const height = 8 + Math.round(
            i < 8
              ? (i / 7) * 24
              : ((14 - i) / 7) * 24
          );
          return (
            <div key={i} style={{ textAlign: "center" }}>
              <div style={{
                width: 18,
                height: height,
                background: isActive
                  ? "#FFD580"
                  : isDone
                  ? "rgba(255,213,128,0.3)"
                  : "rgba(255,255,255,0.06)",
                borderRadius: 3,
                transition: "background 0.15s",
                marginBottom: 4,
              }} />
              <div style={{
                fontSize: 8,
                color: isActive ? "#FFD580" : isDone ? "rgba(255,213,128,0.4)" : "#333",
                letterSpacing: 0,
              }}>
                {s.note}
              </div>
            </div>
          );
        })}
      </div>

      {/* 現在の音 */}
      <div style={{
        background: "rgba(255,213,128,0.06)",
        border: "1px solid rgba(255,213,128,0.15)",
        borderRadius: 12,
        padding: "8px 24px",
        marginBottom: 20,
        textAlign: "center",
        minWidth: 160,
      }}>
        {running ? (
          <>
            <span style={{ color: "#FFD580", fontSize: 22, letterSpacing: "0.2em" }}>
              {currentScale.note}
            </span>
            <span style={{ color: "#555", fontSize: 11, marginLeft: 8 }}>
              {currentScale.label} ({loopIdx + 1}/{TOTAL_LOOPS})
            </span>
          </>
        ) : done ? (
          <span style={{ color: "#FFD580", fontSize: 14, letterSpacing: "0.1em" }}>完了！お疲れさま✨</span>
        ) : (
          <span style={{ color: "#444", fontSize: 13, letterSpacing: "0.15em" }}>ソ から スタート</span>
        )}
      </div>

      {/* メインサークル */}
      <div style={{
        position: "relative",
        width: 200, height: 200,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        marginBottom: 20,
      }}>
        <svg width={200} height={200} style={{ position: "absolute" }}>
          <circle cx={100} cy={100} r={90} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth={2} />
          <circle
            cx={100} cy={100} r={90}
            fill="none"
            stroke={running ? current.color : "#222"}
            strokeWidth={2.5}
            strokeOpacity={0.6}
            strokeDasharray={`${2 * Math.PI * 90 * scaleProgress} ${2 * Math.PI * 90}`}
            strokeLinecap="round"
            transform="rotate(-90 100 100)"
            style={{ transition: "stroke 0.2s" }}
          />
        </svg>

        <div style={{ textAlign: "center", position: "relative", zIndex: 2 }}>
          <div style={{
            fontSize: 80,
            lineHeight: 1,
            color: running ? current.color : "#222",
            textShadow: running && flash ? `0 0 30px ${current.color}` : "none",
            transition: "color 0.1s",
          }}>
            {running ? current.kana : "●"}
          </div>
          {running && (
            <div style={{ display: "flex", gap: 3, justifyContent: "center", marginTop: 6 }}>
              {Array.from({ length: current.beats }).map((_, i) => (
                <div key={i} style={{
                  width: 5, height: 5,
                  borderRadius: "50%",
                  background: i < beat ? current.color : "rgba(255,255,255,0.1)",
                  transition: "background 0.05s",
                }} />
              ))}
            </div>
          )}
        </div>
      </div>

      {/* 音の一覧 */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {SOUNDS.map((s, i) => {
          const isActive = running && i === soundIdx;
          const isDone = running && i < soundIdx;
          return (
            <div key={i} style={{ textAlign: "center" }}>
              <div style={{
                width: 36, height: 36,
                borderRadius: 8,
                background: isActive ? s.color + "22" : "rgba(255,255,255,0.02)",
                border: `1px solid ${isActive ? s.color : isDone ? s.color + "44" : "rgba(255,255,255,0.06)"}`,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 16,
                color: isActive ? s.color : isDone ? s.color + "88" : "#2a2a2a",
                transition: "all 0.15s",
                marginBottom: 3,
              }}>
                {s.kana}
              </div>
              <div style={{ fontSize: 8, color: "#333" }}>{s.beats}拍</div>
            </div>
          );
        })}
      </div>

      {/* ボリューム＋BPM設定 */}
      {!running && (
        <div style={{
          background: "rgba(255,255,255,0.02)",
          border: "1px solid rgba(255,255,255,0.07)",
          borderRadius: 14,
          padding: "14px 20px",
          width: "100%",
          maxWidth: 280,
          marginBottom: 20,
        }}>
          {/* BPM */}
          <div style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ color: "#555", fontSize: 10, letterSpacing: "0.2em" }}>BPM</span>
              <span style={{ color: "#fff", fontSize: 18, fontWeight: 300 }}>{bpm}</span>
            </div>
            <input type="range" min={90} max={200} step={1} value={bpm}
              onChange={(e) => setBpm(Number(e.target.value))}
              style={{ width: "100%", accentColor: "#FFD580", cursor: "pointer" }} />
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
              <span style={{ color: "#333", fontSize: 9 }}>90</span>
              <span style={{ color: "#333", fontSize: 9 }}>200</span>
            </div>
            {/* プリセット */}
            <div style={{ display: "flex", gap: 6, marginTop: 8, justifyContent: "center" }}>
              {[{l:"ゆっくり",v:90},{l:"普通",v:120},{l:"速い",v:160},{l:"最速",v:200}].map(({l,v}) => (
                <button key={v} onClick={() => setBpm(v)} style={{
                  background: bpm===v ? "rgba(255,213,128,0.15)" : "rgba(255,255,255,0.03)",
                  border: `1px solid ${bpm===v ? "#FFD580" : "rgba(255,255,255,0.07)"}`,
                  color: bpm===v ? "#FFD580" : "#444",
                  fontSize: 9, padding: "3px 8px",
                  borderRadius: 20, cursor: "pointer",
                }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ borderTop: "1px solid rgba(255,255,255,0.05)", paddingTop: 12 }}>
            {/* メトロノーム音量 */}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <span style={{ color: "#555", fontSize: 10, minWidth: 68, letterSpacing: "0.05em" }}>メトロノーム</span>
              <input type="range" min={0} max={1} step={0.05} value={metroVol}
                onChange={(e) => setMetroVol(Number(e.target.value))}
                style={{ flex: 1, accentColor: "#7AC8FF", cursor: "pointer" }} />
              <span style={{ color: "#444", fontSize: 10, minWidth: 24, textAlign: "right" }}>
                {Math.round(metroVol * 100)}
              </span>
            </div>
            {/* ガイド音量 */}
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ color: "#555", fontSize: 10, minWidth: 68, letterSpacing: "0.05em" }}>ガイド音</span>
              <input type="range" min={0} max={1} step={0.05} value={guideVol}
                onChange={(e) => setGuideVol(Number(e.target.value))}
                style={{ flex: 1, accentColor: "#C084FC", cursor: "pointer" }} />
              <span style={{ color: "#444", fontSize: 10, minWidth: 24, textAlign: "right" }}>
                {Math.round(guideVol * 100)}
              </span>
            </div>
          </div>
        </div>
      )}

      {/* BPM表示（実行中） */}
      {running && (
        <p style={{ color: "rgba(255,255,255,0.15)", fontSize: 11, marginBottom: 12, letterSpacing: "0.15em" }}>
          {bpm} BPM
        </p>
      )}

      {/* ボタン */}
      {!running ? (
        <button onClick={start} style={{
          background: "none",
          border: "1px solid rgba(255,255,255,0.2)",
          color: "#fff",
          fontSize: 13,
          letterSpacing: "0.25em",
          padding: "12px 44px",
          borderRadius: 40,
          cursor: "pointer",
        }}>
          {done ? "もう一度" : "はじめる"}
        </button>
      ) : (
        <button onClick={stop} style={{
          background: "none",
          border: "none",
          color: "rgba(255,255,255,0.2)",
          fontSize: 11,
          letterSpacing: "0.2em",
          cursor: "pointer",
          padding: "8px 20px",
        }}>
          とめる
        </button>
      )}

      <p style={{
        marginTop: 28, fontSize: 9,
        color: "rgba(255,255,255,0.08)",
        letterSpacing: "0.15em", textAlign: "center",
      }}>
        ひ8拍 ・ へ8拍 ・ は4拍 ・ ほ4拍 ・ ふ4拍 ／ 15ループ
      </p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HahehiApp />);
</script>
</body>
</html>
