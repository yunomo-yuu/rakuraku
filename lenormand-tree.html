<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命の木 ルノルマン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --ink:#efe7d6; --sub:#b8b0a0; --gold:#e8c46a; --gold2:#fff1c2;
  --teal:#63e6d6; --line:rgba(232,196,106,.28); --panel:rgba(8,10,28,.80);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}

/* ===== 宇宙の背景（後でマツコ/ミルの背景画に差し替え可） ===== */
#sky{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.nebula{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:
  radial-gradient(40% 30% at 20% 25%,rgba(80,60,170,.32),transparent 70%),
  radial-gradient(35% 25% at 85% 55%,rgba(30,120,150,.26),transparent 70%),
  radial-gradient(55% 28% at 50% 100%,rgba(232,196,106,.20),transparent 70%)}
.vortex{position:fixed;left:50%;bottom:-30vmin;width:130vmin;height:46vmin;transform:translateX(-50%);
  z-index:0;pointer-events:none;border-radius:50%;opacity:.55;
  background:repeating-radial-gradient(ellipse at center,rgba(232,196,106,.16) 0 1px,transparent 2px 12px);
  -webkit-mask:radial-gradient(ellipse at center,#000 30%,transparent 70%);
  mask:radial-gradient(ellipse at center,#000 30%,transparent 70%)}

#bgimg{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;display:none}
#bgimg::after{content:"";position:absolute;inset:0;background:rgba(3,4,12,.42)}
.has-bg #bgimg{display:block}
.has-bg .nebula,.has-bg .vortex{display:none}
.has-bg #sky{opacity:.6}
.cardback.imgback{background-size:cover;background-position:center;box-shadow:none;border-color:rgba(232,196,106,.5)}
.cardback.imgback::after{content:none}

/* ===== 場面 ===== */
.scene{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
  opacity:0;transform:translateY(56px);pointer-events:none;transition:opacity 1s ease,transform 1s ease;text-align:center}
.scene.active{opacity:1;transform:none;pointer-events:auto}
.scene.leave{opacity:0;transform:translateY(-56px)}

.eyebrow{letter-spacing:.4em;font-size:12px;color:var(--gold);margin-bottom:18px}
h1{font-size:34px;font-weight:700;letter-spacing:.18em;color:var(--gold2);
  text-shadow:0 0 24px rgba(232,196,106,.55)}
.lead{margin-top:22px;line-height:2.1;font-size:15px;color:var(--ink)}
.small{font-size:12.5px;color:var(--sub);line-height:1.9}
.btn{margin-top:30px;min-width:200px;padding:14px 28px;border-radius:40px;border:1px solid var(--gold);
  background:linear-gradient(180deg,rgba(232,196,106,.22),rgba(232,196,106,.06));color:var(--gold2);
  font-size:16px;letter-spacing:.15em;cursor:pointer;box-shadow:0 0 18px rgba(232,196,106,.25)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{background:transparent;border-color:rgba(232,196,106,.45);color:var(--ink);font-size:14px;box-shadow:none}

#worry{margin-top:22px;width:min(100%,420px);height:110px;resize:none;border-radius:14px;padding:14px;
  background:rgba(10,12,34,.75);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.7}
#worry:focus{outline:none;border-color:var(--gold)}

.doors{margin-top:26px;display:flex;flex-direction:column;gap:16px;width:min(100%,420px)}
.door{padding:20px 18px;border-radius:16px;cursor:pointer;text-align:left;color:var(--ink);background:rgba(10,12,34,.7)}
.door b{display:block;font-size:19px;letter-spacing:.12em;margin-bottom:8px}
.door span{font-size:13px;line-height:1.85;color:var(--sub)}
.door.down{border:1px solid rgba(232,196,106,.7);box-shadow:0 0 22px rgba(232,196,106,.18)}
.door.down b{color:var(--gold2)}
.door.up{border:1px solid rgba(99,230,214,.7);box-shadow:0 0 22px rgba(99,230,214,.16)}
.door.up b{color:var(--teal)}

/* ===== 木の場面 ===== */
#s-tree{justify-content:flex-start;padding:max(10px,env(safe-area-inset-top)) 0 0}
#treeWrap{flex:1 1 auto;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;padding:6px 10px}
#tree{height:100%;max-width:100%;overflow:visible}
#panel{flex:0 0 auto;width:100%;max-height:44dvh;overflow-y:auto;background:var(--panel);
  border-top:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:18px 22px max(20px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0;text-align:center;
  transition:max-height .8s ease}
#panel.final{max-height:64dvh;text-align:left}
#panel .stepno{font-size:12px;letter-spacing:.2em;color:var(--sub)}
#panel h2{margin-top:6px;font-size:24px;letter-spacing:.14em}
#panel h2 small{font-size:13px;margin-left:10px;color:var(--sub);letter-spacing:.1em}
#panel .theme{margin-top:8px;font-size:13.5px;color:var(--gold)}
#panel .narr{margin-top:10px;font-size:14.5px;line-height:1.95}
#panel .btn{margin-top:16px}
.placed{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:14px;text-align:left}
.placed .mini{width:46px;height:69px;flex:0 0 auto}
.placed b{font-size:18px;letter-spacing:.1em}
.placed span{font-size:13px;color:var(--sub)}

/* 最終画面 */
#panel h3{font-size:16px;color:var(--gold2);margin:20px 0 8px;letter-spacing:.12em}
.sum{list-style:none;margin-top:10px}
.sum li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(232,196,106,.12);font-size:14px}
.sum .sn{width:6.2em;flex:0 0 auto;color:var(--sub);font-size:12.5px}
.sum .kw{color:var(--sub);font-size:12px;margin-left:auto;text-align:right}
#prompt{width:100%;height:170px;margin-top:8px;padding:12px;border-radius:12px;resize:vertical;
  background:rgba(4,5,14,.8);border:1px solid var(--line);color:var(--ink);font-size:12.5px;line-height:1.7;font-family:inherit}
.endDoors{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.endDoors .door{width:100%;padding:16px 16px;transition:transform .2s,box-shadow .3s}
.endDoors .door b{font-size:17px}
.door.yuu{border:1px solid rgba(185,168,255,.75);box-shadow:0 0 22px rgba(185,168,255,.16)}
.door.yuu b{color:#d9ceff}
.endDoors .door.chosen{transform:scale(1.02);box-shadow:0 0 30px rgba(255,241,194,.35)}
.keyrow{display:flex;gap:8px;margin-top:10px}
.keyrow input{flex:1;min-width:0;padding:12px 14px;border-radius:30px;background:rgba(4,5,14,.8);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:16px}
.keyrow .btn{margin-top:0;min-width:0;padding:12px 20px}
#yuuMsg{width:100%;margin-top:8px;padding:12px;border-radius:12px;resize:none;background:rgba(4,5,14,.8);border:1px solid var(--line);color:var(--ink);font-size:13px;line-height:1.7;font-family:inherit}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.row .btn{min-width:0;margin-top:14px}

/* ===== SVG ノード ===== */
.path{stroke:rgba(232,196,106,.18);stroke-width:1.2}
.node{transition:opacity 1.2s ease}
.node.dim{opacity:.3}
.node.hide{opacity:0}
.node .halo{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity 1s}
.node.lit .halo{opacity:.32}
.node.active .halo{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.88)}50%{opacity:.75;transform:scale(1.18)}}
.node .nm{font-size:11px;fill:var(--ink);text-anchor:middle;letter-spacing:.05em}
.node .num{font-size:14px;font-weight:700;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:3px}
#tree.bloom .node .halo{animation:bloom 2.6s ease-out 1}
@keyframes bloom{0%{opacity:.3;transform:scale(1)}40%{opacity:.95;transform:scale(1.6)}100%{opacity:.32;transform:scale(1)}}

/* ===== カード ===== */
.cardback{position:relative;border-radius:8px;border:1px solid rgba(232,196,106,.75);
  background:radial-gradient(circle at 50% 50%,rgba(232,196,106,.22),transparent 45%),linear-gradient(160deg,#18205a,#070a1e);
  box-shadow:inset 0 0 0 3px #0a0d24,inset 0 0 0 4px rgba(232,196,106,.4)}
.cardback::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:1.1em}
.cardface{position:relative;border-radius:10px;border:1px solid rgba(232,196,106,.85);overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(232,196,106,.18),transparent 55%),linear-gradient(170deg,#141a4c,#05071a);
  box-shadow:inset 0 0 0 4px #0a0d24,inset 0 0 0 5px rgba(232,196,106,.45);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cardface img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cardface .cn{position:absolute;top:7%;left:9%;font-size:.9em;color:var(--gold)}
.cardface .ce{font-size:2.6em;filter:drop-shadow(0 0 10px rgba(255,241,194,.55))}
.cardface .cm{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-size:.95em;letter-spacing:.15em;color:var(--gold2)}
.placed .mini.cardface{font-size:8px}

/* ===== オーバーレイ ===== */
.overlay{position:fixed;inset:0;z-index:5;background:rgba(3,4,12,.92);display:flex;flex-direction:column;align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transition:opacity .5s ease;overflow-y:auto}
.overlay.show{opacity:1;pointer-events:auto}
#picker h4{font-size:16px;letter-spacing:.12em;color:var(--gold2);margin:6px 0 4px;text-align:center}
#picker .small{text-align:center}
#grid{margin-top:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:min(100%,420px)}
#grid .slot{aspect-ratio:2/3;font-size:12px;cursor:pointer;transition:transform .2s}
#grid .slot:active{transform:translateY(-4px) scale(1.04)}
#grid .slot.gone{visibility:hidden}
#picker .close{margin-top:16px}

#reveal{justify-content:center}
.flip{width:min(60vw,230px);aspect-ratio:2/3;perspective:1100px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform 1.1s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .b{font-size:30px}
.flip .f{transform:rotateY(180deg);font-size:20px}
#revealText{margin-top:20px;text-align:center;opacity:0;transition:opacity .8s ease .9s}
.flipped ~ #revealText,#reveal.done #revealText{opacity:1}
#revealText b{font-size:22px;letter-spacing:.15em;color:var(--gold2)}
#revealText p{margin-top:8px;font-size:14px;color:var(--sub)}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:9;padding:10px 20px;border-radius:30px;
  background:rgba(232,196,106,.95);color:#1a1405;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  .scene,.flip .inner,.node,#panel{transition:none}
  .node.active .halo,#tree.bloom .node .halo{animation:none;opacity:.6}
}
</style>
</head>
<body>
<div id="bgimg"></div>
<canvas id="sky"></canvas>
<div class="nebula"></div>
<div class="vortex"></div>

<!-- 1 はじまり -->
<section class="scene active" id="s-intro">
  <div class="eyebrow">TREE OF LIFE × LENORMAND</div>
  <h1>生命の木</h1>
  <p class="lead">十一の光に、カードを一枚ずつ。<br>あなたの悩みが、どこから来て<br>どこへ向かうのかを辿る旅。</p>
  <button class="btn" data-go="s-worry">はじめる</button>
</section>

<!-- 2 悩み -->
<section class="scene" id="s-worry">
  <div class="eyebrow">YOUR QUESTION</div>
  <p class="lead" style="margin-top:0">いま抱えている悩みを<br>ひとことで書いてください</p>
  <textarea id="worry" maxlength="140" placeholder="例：今の仕事を続けるか迷っている"></textarea>
  <p class="small" style="margin-top:10px">うまく言葉にならなくても大丈夫。</p>
  <button class="btn" id="worryNext" disabled>次へ</button>
</section>

<!-- 3 扉 -->
<section class="scene" id="s-door">
  <div class="eyebrow">CHOOSE YOUR DOOR</div>
  <p class="lead" style="margin-top:0">どちらの扉から入りますか</p>
  <div class="doors">
    <button class="door down" data-door="down"><b>天からの啓示</b><span>ケテルから稲妻のように降りていく道。上から届いたものが、どう形になって今の悩みになったのかを観る。</span></button>
    <button class="door up" data-door="up"><b>自らの発生</b><span>マルクトから螺旋を描いて昇っていく道。今いる現実から、内側で何が立ち上がろうとしているのかを観る。</span></button>
  </div>
</section>

<!-- 4 木 -->
<section class="scene" id="s-tree">
  <div id="treeWrap"><svg id="tree" viewBox="0 0 320 470" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="panel"></div>
</section>

<!-- カードを選ぶ -->
<div class="overlay" id="picker">
  <h4 id="pickTitle"></h4>
  <p class="small" id="pickSub"></p>
  <div id="grid"></div>
  <button class="btn ghost close" id="pickClose">もどる</button>
</div>

<!-- めくる -->
<div class="overlay" id="reveal">
  <div class="flip" id="flip"><div class="inner"><div class="b cardback"></div><div class="f cardface" id="face"></div></div></div>
  <div id="revealText"><b id="rvName"></b><p id="rvKw"></p></div>
  <button class="btn" id="placeBtn">この場所に置く</button>
</div>

<div id="toast"></div>

/* ===== カードの見た目 ===== */
function faceHTML(n){

  if(src) return `<img src="${src}" alt="${c[1]}">`;
  return `<span class="cn">${c[0]}</span><span class="ce">${c[2]}</span><span class="cm">${c[1]}</span>`;

/* ===== 木を描く ===== */
function buildTree(){
  let defs = '<defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>'+
             '<filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  for(const k in SEPH){const s=SEPH[k];
    defs += `<radialGradient id="rg-${k}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${s.light}"/><stop offset="1" stop-color="${s.color}"/></radialGradient>`;}
  defs += '</defs>';
  const lines = PATHS.map(([a,b])=>`<line class="path" x1="${SEPH[a].x}" y1="${SEPH[a].y}" x2="${SEPH[b].x}" y2="${SEPH[b].y}"/>`).join('');
  let nodes = '';
  for(const k in SEPH){const s=SEPH[k];
    const dash = k==='daath' ? ' stroke-dasharray="3 3"' : '';
    nodes += `<g class="node dim${k==='daath'?' hide':''}" id="n-${k}" transform="translate(${s.x} ${s.y})">
      <circle class="halo" r="30" fill="${s.light}" filter="url(#glow)"/>
      <circle r="20" fill="url(#rg-${k})" stroke="rgba(255,241,194,.65)" stroke-width="1"${dash}/>
      <text class="num" y="5"></text>
      <text class="nm" y="34">${s.name}</text></g>`;}
  $('tree').innerHTML = defs + '<g>'+lines+'</g><g id="traces"></g><g>'+nodes+'</g>';
}

function trace(a,b){
  const A=SEPH[a], B=SEPH[b], up = st.door==='up';
  let d;
  if(up){
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
    st.side *= -1; const off = 42*st.side;
    d = `M${A.x} ${A.y} Q${mx-dy/len*off} ${my+dx/len*off} ${B.x} ${B.y}`;
  }else{
    d = `M${A.x} ${A.y} L${B.x} ${B.y}`;
  }
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('fill','none');
  p.setAttribute('stroke',DOOR[st.door].color); p.setAttribute('stroke-width','2.4');
  p.setAttribute('stroke-linecap','round'); p.setAttribute('filter','url(#lineglow)');
  $('traces').appendChild(p);
  const L = p.getTotalLength();
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset 1.3s ease';
  p.style.strokeDashoffset = 0;
}

/* ===== 進行 ===== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startTree(){
  st.order = ORDER[st.door]; st.step = 0; st.placed = {}; st.side = 1;
  st.deck = shuffle(CARDS.map(c=>c[0]));
  preloadCards();
  buildTree(); buildGrid();
  $('panel').classList.remove('final');
  setTimeout(showStep,700);
}

function showStep(){
  const k = st.order[st.step], s = SEPH[k];
  document.querySelectorAll('.node.active').forEach(n=>n.classList.remove('active'));
  const node = $('n-'+k);
  if(k==='daath'){ node.classList.remove('hide'); }
  if(st.step>0 && k!=='daath') trace(st.order[st.step-1],k);
  setTimeout(()=>{node.classList.remove('dim'); node.classList.add('active');}, k==='daath'?200:900);
  renderStepPanel(false);
}

}

async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function showSelf(){

  L.push('【選んだ扉】'); L.push(`${DOOR[st.door].name}（${DOOR[st.door].desc}）`); L.push('');
  L.push('【配置】（灯った順）');
  st.order.forEach((k,i)=>{const s=SEPH[k],c=card(st.placed[k]);

    L.push(`${SEPH[a].name}→${SEPH[b].name}：${card(st.placed[a])[1]}×${card(st.placed[b])[1]}`);}
  L.push('');
  L.push('【三本の柱】');
  PILLARS.forEach(([nm,ks])=>L.push(`${nm}：`+ks.map(k=>`${SEPH[k].name}=${card(st.placed[k])[1]}`).join('、')));
  L.push('');
  L.push('【読み方のルール】');
  L.push('ここに書かれたカードと配置だけを根拠にする。書かれていないカードや意味を創作しない');
  L.push('ルノルマンは具体的なカードなので、マルクトに近いほど現実の出来事として、ケテルに近いほど象徴として読む');
  L.push('扉の向きに沿って、灯った順に一つの物語として繋げて読む');
  L.push('三本の柱は、与える力（慈悲）と断つ力（峻厳）のどちらに偏っているかを見るのに使う');
  L.push('イェソドは特に丁寧に読む。本人が気づかないまま繰り返している癖やパターンとして、具体的な言葉にする');
  L.push('イェソドを読むときは、ホド→イェソド（考えが無意識に沈む道）と、イェソド→マルクト（無意識が現実に現れる道）の二組を必ず使う');
  L.push('無意識のパターンは、指摘して終わらせず、気づきのきっかけを一つだけそっと添える。こうしなさいと指示はしない');
  L.push('ダアトは最後に、本人がまだ見えていない盲点と、悩みを越える鍵として読む');
  L.push('吉凶を断定せず、傾向で伝える。最後の活かし方も、助言や指示ではなく、本人が自分で動き出すためのきっかけとして短く添える');
  L.push('読み始める前に、悩みについて一つだけ質問して確認してから読む');
  return L.join('\n');
}

function copy(text, box){
  const done = ()=>toast('コピーしました');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  }else fallback();
  function fallback(){const t=box;t.removeAttribute('readonly');t.select();
    try{document.execCommand('copy');done();}catch(e){toast('長押しでコピーしてください');}
    t.setAttribute('readonly','');}
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
    stars=Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:.5+Math.random()*1.5,g:Math.random()<.12}));}
  function draw(t){cx.clearRect(0,0,W,H);
    for(const s of stars){const a=.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s*.6));
      cx.fillStyle=s.g?`rgba(255,226,150,${a})`:`rgba(230,235,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();}
    if(!still) requestAnimationFrame(draw);}
  addEventListener('resize',size); size(); requestAnimationFrame(draw);
})();
</script>
