<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>売上メモ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="uriage-icon.png">
<link rel="icon" href="uriage-icon.png">
<meta name="apple-mobile-web-app-title" content="売上メモ">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Hiragino Sans",sans-serif;background:#fff;color:#222;text-align:center;padding:24px;box-sizing:border-box}
img{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.go{display:block;margin:24px auto 0;padding:16px 32px;background:#2f8f6b;color:#fff;font-weight:bold;font-size:18px;border-radius:12px;text-decoration:none}
.box{max-width:340px}
p{line-height:1.7}
small{color:#888}
button{margin-top:16px;padding:12px 20px;font-size:15px;border:2px solid #222;background:#fff;border-radius:10px}
</style>
</head>
<body>
<div class="box">
  <img src="uriage-icon.png" alt="">
  <div id="setup" hidden>
    <p>この画面で、下の共有ボタン →「ホーム画面に追加」をしてね。<br>追加できたら下のボタンを押してね。</p>
    <button id="done" type="button">追加したよ</button>
  </div>
  <div id="opening" hidden>
    <p>売上メモをひらいています…</p>
  </div>
  <a class="go" id="go" href="#">売上メモをひらく</a>
  <p><small>※ひらかない時は上のボタンをタップ</small></p>
</div>
<script>
(function(){
  var GAS_URL = "https://script.google.com/macros/s/AKfycbxyGyYC0WM8tUUsCeCUA4ukLGJrNyRpX54HeDF2Py2k5VSBDP96TownU5oPlQfBh4uB/exec";
  var KEY = "uriage-ready";
  var ready = false;
  try { ready = localStorage.getItem(KEY) === "1"; } catch (e) {}
  if (location.search.indexOf("setup") >= 0) ready = false;

  document.getElementById("go").href = GAS_URL;

  if (ready) {
    document.getElementById("opening").hidden = false;
    setTimeout(function(){ location.replace(GAS_URL); }, 200);
  } else {
    document.getElementById("setup").hidden = false;
  }

  document.getElementById("done").addEventListener("click", function(){
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
    location.replace(GAS_URL);
  });
})();
</script>
</body>
</html>
