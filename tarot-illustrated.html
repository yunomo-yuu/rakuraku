<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarot">
<meta name="theme-color" content="#0a0a14">
<title>大アルカナ - Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c4a86b;--goldL:#d4b87a;--dk:#0a0a14;--dk2:#12101e;--purp:#1a1530;--ff:'Shippori Mincho','Hiragino Mincho ProN',serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,var(--dk),var(--dk2));font-family:var(--ff);color:#e8e0d0;display:flex;flex-direction:column;align-items:center;padding:36px 16px 48px;position:relative;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(196,168,107,.35);animation:starF 3s ease infinite;}
@keyframes starF{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.3)}}
.eyebrow{font-size:10px;letter-spacing:6px;color:rgba(196,168,107,.45);text-transform:uppercase;margin-bottom:8px;}
h1{font-size:22px;font-weight:800;color:var(--gold);letter-spacing:4px;margin-bottom:4px;}
.sub{font-size:11px;color:rgba(232,224,208,.35);letter-spacing:2px;margin-bottom:32px;}
.card-area{perspective:1200px;width:200px;height:330px;margin:0 auto 24px;position:relative;cursor:pointer;}
.card-inner{width:100%;height:100%;position:relative;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{backface-visibility:hidden;position:absolute;top:0;left:0;width:100%;height:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;}
.card-back{background:linear-gradient(135deg,var(--dk2),var(--purp));border:1.5px solid var(--gold);}
.back-inner{width:130px;height:210px;border:1px solid rgba(196,168,107,.25);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:repeating-conic-gradient(rgba(196,168,107,.05) 0% 25%,transparent 0% 50%) 50%/20px 20px;}
.back-sym{font-size:32px;color:var(--gold);opacity:.55;margin-bottom:8px;}
.back-label{font-size:10px;letter-spacing:4px;color:rgba(196,168,107,.35);text-transform:uppercase;}
.card-front{transform:rotateY(180deg);background:#0e0b18;border:1.5px solid var(--gold);}
.card-front.glow{animation:glow 2s ease infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(196,168,107,.15)}50%{box-shadow:0 0 45px rgba(196,168,107,.35)}}
.card-img{width:100%;height:100%;object-fit:cover;border-radius:9px;transition:transform .3s;}
.card-img.reversed{transform:rotate(180deg);}
.result{text-align:center;animation:fadeUp .5s ease;max-width:300px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;padding:4px 18px;border-radius:20px;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:3px;}
.badge.upright{background:rgba(196,168,107,.12);border:1px solid rgba(196,168,107,.35);color:var(--goldL);}
.badge.rev{background:rgba(107,76,154,.2);border:1px solid rgba(107,76,154,.45);color:#b89adb;}
.card-title{font-size:18px;font-weight:800;color:#f0e6d0;letter-spacing:2px;margin:6px 0 2px;}
.card-en{font-size:10px;color:rgba(196,168,107,.45);letter-spacing:1px;margin-bottom:10px;}
.keywords{font-size:14px;line-height:2;color:#e8e0d0;letter-spacing:1px;margin-bottom:24px;}
.btns{display:flex;gap:12px;margin-top:4px;}
button{font-family:var(--ff);cursor:pointer;transition:all .2s;border-radius:8px;}
.draw-btn{padding:14px 40px;font-size:14px;font-weight:700;color:var(--gold);background:transparent;border:1.5px solid var(--gold);letter-spacing:3px;}
.draw-btn:hover,.draw-btn:active{background:linear-gradient(135deg,var(--goldL),var(--gold));color:var(--dk);}
.sm-btn{padding:12px 32px;font-size:13px;font-weight:700;color:var(--gold);background:transparent;border:1.5px solid var(--gold);letter-spacing:2px;}
.sm-btn:hover{background:linear-gradient(135deg,var(--goldL),var(--gold));color:var(--dk);}
.ghost-btn{padding:12px 20px;font-size:12px;color:rgba(232,224,208,.35);background:transparent;border:1px solid rgba(232,224,208,.12);}
.ghost-btn:hover{border-color:var(--goldL);color:var(--goldL);}
.history{margin-top:36px;width:100%;max-width:320px;}
.hist-title{font-size:10px;letter-spacing:4px;color:rgba(196,168,107,.3);margin-bottom:10px;text-transform:uppercase;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(232,224,208,.05);font-size:12px;}
.hist-time{color:rgba(232,224,208,.4);}
.hist-name{color:#e8e0d0;}
.hist-pos{font-size:10px;letter-spacing:1px;}
.hist-pos.up{color:rgba(196,168,107,.5);}
.hist-pos.rv{color:#b89adb;}
.foot{margin-top:40px;font-size:9px;color:rgba(232,224,208,.18);letter-spacing:1px;}
</style>
</head>
<body>
<p class="eyebrow">Tarot Reading</p>
<h1>大アルカナ</h1>
<p class="sub">22枚の物語からひとつを引く</p>
<div class="card-area" id="cardArea" onclick="handleClick()">
<div class="card-inner" id="cardInner">
<div class="card-face card-back"><div class="back-inner"><div class="back-sym">✧</div><div class="back-label">Draw</div></div></div>
<div class="card-face card-front" id="cardFront"><img class="card-img" id="cardImg" src="" alt=""></div>
</div>
</div>
<div class="result" id="result" style="display:none">
<div id="badge" class="badge"></div>
<p class="card-title" id="cTitle"></p>
<p class="card-en" id="cEn"></p>
<p class="keywords" id="keywords"></p>
</div>
<div class="btns" id="btns"><button class="draw-btn" onclick="draw()">カードを引く</button></div>
<div class="history" id="histSec" style="display:none"><p class="hist-title">History</p><div id="histList"></div></div>
<p class="foot">大アルカナ 22枚 ・ 結ゆう</p>

var phase="ready",hist=[];
for(var i=0;i<25;i++){var s=document.createElement("div");s.className="star";s.style.cssText="top:"+Math.random()*100+"%;left:"+Math.random()*100+"%;animation-duration:"+(2+Math.random()*3)+"s;animation-delay:"+Math.random()*3+"s;";document.body.appendChild(s);}
function handleClick(){if(phase==="ready")draw();}
function draw(){
if(phase!=="ready")return;
var c=CARDS[Math.floor(Math.random()*CARDS.length)];
var rv=Math.random()<.5;
var img=document.getElementById("cardImg");
img.src=c.img;
img.className=rv?"card-img reversed":"card-img";
document.getElementById("cardInner").classList.add("flipped");
document.getElementById("cardFront").classList.remove("glow");
document.getElementById("result").style.display="none";
phase="flipping";
setTimeout(function(){
document.getElementById("cardFront").classList.add("glow");
var b=document.getElementById("badge");
b.className=rv?"badge rev":"badge upright";
b.textContent=rv?"逆 位 置":"正 位 置";
document.getElementById("cTitle").textContent=c.n+"  "+c.name;
document.getElementById("cEn").textContent=c.en;
document.getElementById("keywords").textContent=rv?c.rev:c.up;
document.getElementById("result").style.display="block";
document.getElementById("btns").innerHTML='<button class="sm-btn" onclick="again()">もう一度引く<\/button><button class="ghost-btn" onclick="reset()">戻す<\/button>';
var now=new Date();
var t=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2);
hist.unshift({card:c,rv:rv,t:t});if(hist.length>10)hist.pop();
renderHist();
phase="revealed";
},750);
}
function again(){reset();setTimeout(draw,120);}
function reset(){phase="ready";document.getElementById("cardInner").classList.remove("flipped");document.getElementById("cardFront").classList.remove("glow");document.getElementById("result").style.display="none";document.getElementById("btns").innerHTML='<button class="draw-btn" onclick="draw()">カードを引く<\/button>';}
function renderHist(){if(!hist.length)return;document.getElementById("histSec").style.display="block";var h="";for(var i=0;i<hist.length;i++){var x=hist[i];h+='<div class="hist-row"><span class="hist-time">'+x.t+'</span><span class="hist-name">'+x.card.n+" "+x.card.name+'</span><span class="hist-pos '+(x.rv?"rv":"up")+'">'+(x.rv?"逆":"正")+"</span></div>";}document.getElementById("histList").innerHTML=h;}
</script>
