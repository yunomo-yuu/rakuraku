<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整う部屋 ｜ 結ゆう</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --yozora-ue:#0b1626; --yozora-naka:#152944; --yozora-shita:#1b3a5b;
  --kin:#c9a24b; --hoshi:#f2ede1;
  --moji:#e9e5d9; --usumoji:#b9b4a6; --sen:rgba(242,237,225,.18);
  --kaado:rgba(242,237,225,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  background:linear-gradient(180deg,var(--yozora-ue) 0%,var(--yozora-naka) 45%,var(--yozora-shita) 100%);
  background-attachment:fixed;
  color:var(--moji); line-height:1.9;
  min-height:100vh;
  position:relative;
}
/* 星空 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1px 1px at 15% 12%, rgba(242,237,225,.8) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 80% 8%, rgba(201,162,75,.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 60% 22%, rgba(242,237,225,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 35%, rgba(242,237,225,.4) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 30%, rgba(242,237,225,.45) 50%, transparent 51%),
    radial-gradient(1px 1px at 10% 55%, rgba(242,237,225,.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 45% 62%, rgba(201,162,75,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 75% 58%, rgba(242,237,225,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 25% 78%, rgba(242,237,225,.45) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 65% 85%, rgba(242,237,225,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 92%, rgba(201,162,75,.45) 50%, transparent 51%);
}
main,header,footer,.modori{position:relative; z-index:1}
.modori{
  display:inline-block; font-size:12px; color:var(--usumoji); text-decoration:none;
  letter-spacing:.15em; padding:16px 20px;
}
.modori:hover{color:var(--kin)}
header{
  color:var(--hoshi); text-align:center;
  padding:42px 20px 36px;
}
header h1{font-size:22px; font-weight:600; letter-spacing:.25em}
header p{font-size:12px; opacity:.72; margin-top:12px; letter-spacing:.12em; line-height:1.8}
main{max-width:560px; margin:0 auto; padding:10px 20px 60px}
section{
  background:var(--kaado); border:1px solid var(--sen); border-radius:2px;
  padding:26px 24px; margin:20px 0;
}
section h2{
  font-size:15px; color:var(--kin); letter-spacing:.2em; font-weight:600;
  border-bottom:1px solid var(--sen); padding-bottom:10px; margin-bottom:16px;
}
.dogu{
  display:block; text-decoration:none; color:inherit;
  border:1px solid var(--sen); border-radius:2px;
  padding:18px 18px; margin:12px 0;
  transition:border-color .2s;
}
.dogu:hover{border-color:var(--kin)}
.dogu h3{font-size:15px; color:var(--hoshi); font-weight:600; letter-spacing:.1em}
.dogu p{font-size:12px; color:var(--usumoji); margin-top:6px}
.soeb{font-size:11px; color:var(--usumoji); opacity:.8; margin-top:14px; line-height:1.8; letter-spacing:.03em}
footer{
  text-align:center; font-size:11px; color:var(--usumoji); opacity:.7;
  padding:26px 20px; letter-spacing:.2em; border-top:1px solid var(--sen);
}
</style>
</head>
<body>
<a class="modori" href="index.html">← 玄関へもどる</a>

<header>
  <h1>整う部屋</h1>
  <p>ここは、わたしが自分を整えるための部屋。<br>音で、息で、からだで。<br>精神とフィジカルは、ほんとうは地続き。</p>
</header>

<main>
  <section>
    <h2>精神をととのえる</h2>
    <a class="dogu" href="chakra.html">
      <h3>七つの音</h3>
      <p>チャクラに寄り添うバイノーラルビート。ひとつ選んで、目を閉じて。イヤホンでどうぞ。</p>
    </a>
  </section>

  <section>
    <h2>フィジカルをととのえる</h2>
    <a class="dogu" href="breath.html">
      <h3>呼吸 三十六</h3>
      <p>吸って、吐いて、三十六回。圧をかけて、限界まで。ゆるめる呼吸じゃない、通す呼吸。</p>
    </a>
    <a class="dogu" href="diaphragm.html">
      <h3>横隔膜トレーニング</h3>
      <p>音階にのせて、横隔膜を上下に。声とからだの、いちばん下の土台をつくる。</p>
    </a>
    <p class="soeb">やる日も、やらない日も、どっちも正解。身体の声を、いちばん先に聞いてあげて。</p>
  </section>
</main>

<footer>結 ｜ you-no-oto.jp</footer>
</body>
</html>
