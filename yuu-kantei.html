<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif}
body{padding:20px 16px 60px;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit}
.desk{max-width:860px;margin:0 auto}
.desk h1{font-size:21px;letter-spacing:.2em;color:var(--gold2);text-align:center;margin:6px 0 4px}
.desk .lead{text-align:center;font-size:12px;color:var(--sub);margin-bottom:20px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 20px;margin-bottom:16px}
.step h2{font-size:15px;letter-spacing:.1em;color:var(--gold);margin-bottom:10px}
.step h2 span{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;border:1px solid var(--gold);margin-right:8px;font-size:12px}
.note{font-size:12.5px;color:var(--sub);line-height:1.8}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=password],textarea{width:100%;padding:11px 13px;border-radius:10px;background:rgba(4,5,14,.85);border:1px solid var(--line);color:var(--ink);font-size:16px;line-height:1.75}
textarea{resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{margin-top:12px;padding:12px 22px;border-radius:30px;border:1px solid var(--gold);cursor:pointer;
  background:linear-gradient(180deg,rgba(232,196,106,.22),rgba(232,196,106,.06));color:var(--gold2);font-size:15px;letter-spacing:.1em}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(232,196,106,.45)}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:10px}
.err{color:#ff9d8a;font-size:13px;margin-top:8px;min-height:1em}
.hidden{display:none !important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 20px;border-radius:30px;background:rgba(232,196,106,.95);color:#1a1405;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#gate{max-width:360px;margin:16vh auto 0;text-align:center}
#gate h1{font-size:20px;letter-spacing:.25em;color:var(--gold2);margin-bottom:18px}

/* ===== 鑑定書プレビュー（A4のページを縮小して表示） ===== */
#preview{max-width:794px;margin:0 auto}
.pv{position:relative;margin:0 auto 14px;overflow:hidden;border:1px solid rgba(232,196,106,.35);border-radius:4px}
.pv > .page{position:absolute;top:0;left:0;transform-origin:0 0}

  <input type="password" id="gateKey" placeholder="合言葉" autocomplete="off">
  <button class="btn" id="gateGo">開く</button>
  <p class="err" id="gateErr"></p>
</div>

<div class="desk hidden" id="desk">
  <h1>生命の木 鑑定士の机</h1>
  <p class="lead">結ゆう専用</p>

  <section class="step">
    <h2><span>1</span>届いたメッセージを貼る</h2>
    <p class="note">お客さんから届いた申し込み文を、そのまま全部貼ってください。悩みと配置コードを読み取ります。</p>
    <textarea id="inMsg" rows="5" placeholder="【生命の木 鑑定の申し込み】&#10;悩み：…&#10;扉：…&#10;配置コード：D-01-23-…"></textarea>
    <label for="inName">お名前（鑑定書に「〇〇 様」と入ります。空でもOK）</label>
    <input type="text" id="inName" autocomplete="off">
    <div class="row"><button class="btn" id="readBtn">木を再現する</button></div>
    <p class="err" id="readErr"></p>
  </section>

  <section class="step hidden" id="stepPrompt">
    <h2><span>2</span>クレイかマツコに読んでもらう</h2>
    <p class="note">発注文をコピーして、クレイかマツコに貼ってください。章立てが決まっているので、毎回同じ形の鑑定文が返ってきます。</p>
    <textarea id="kPrompt" rows="6" readonly></textarea>
    <div class="row"><button class="btn" id="kCopy">発注文をコピー</button></div>
  </section>

  <section class="step hidden" id="stepText">
    <h2><span>3</span>読みとアドバイスを入れる</h2>
    <label for="aiText">返ってきた鑑定文を貼る（【見出し】の行が章の見出しになります）</label>
    <textarea id="aiText" rows="9"></textarea>
    <label for="advice">結からのアドバイス</label>
    <textarea id="advice" rows="5"></textarea>
    <div class="row"><button class="btn" id="previewBtn">鑑定書の見た目を確かめる</button></div>
  </section>

  <section class="step hidden" id="stepPdf">
    <h2><span>4</span>鑑定書をPDFにする</h2>
    <p class="note">PDFを作ったあと、「送る・保存する」からLINEやファイルに渡せます。</p>
    <div class="row">

    </div>

</div>

/* ===== 合言葉 ===== */
async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function openDesk(){ $('gate').classList.add('hidden'); $('desk').classList.remove('hidden'); }
try{ if(localStorage.getItem('yuu_desk') === DESK_KEY_HASH) openDesk(); }catch(e){}
async function tryGate(){
  const v = $('gateKey').value.trim(); if(!v) return;
  if(await sha256(v) === DESK_KEY_HASH){ try{ localStorage.setItem('yuu_desk', DESK_KEY_HASH); }catch(e){} openDesk(); }
  else $('gateErr').textContent = '合言葉が違うようです';
}
$('gateGo').onclick = tryGate;
$('gateKey').onkeydown = e=>{ if(e.key==='Enter') tryGate(); };

/* ===== 1 読み取り ===== */
function parse(text){
  const t = text.replace(/[－ー―‐−]/g,'-').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[Ｄｄ]/g,'D').replace(/[Ｕｕ]/g,'U');
  const m = t.match(/([DU])\s*-\s*(\d{1,2}(?:\s*-\s*\d{1,2}){10})/i);
  if(!m) return {err:'配置コードが見つかりません（D-01-02-… の形）'};
  const door = m[1].toUpperCase()==='D' ? 'down' : 'up';
  const nums = m[2].split('-').map(s=>parseInt(s.trim(),10));
  if(nums.some(n=>!(n>=1&&n<=36))) return {err:'1〜36以外の番号が入っています'};
  if(new Set(nums).size!==11) return {err:'同じカードが重なっています'};
  const w = t.match(/悩み\s*[：:]\s*(.+)/);
  return {door, nums, worry: w ? w[1].trim() : ''};
}

 up:[

  L.push('あなたは生命の木（カバラ）とルノルマンカードの熟練した鑑定士です。以下の配置だけを根拠に、相談者へ渡す鑑定書の本文を書いてください。');
  L.push('');
  L.push('【悩み】'); L.push(k.worry); L.push('');
  L.push('【選んだ扉】'); L.push(`${D.name}（${D.desc}）`); L.push('');
  L.push('【配置】（灯った順）');

  L.push('');
  L.push('【鑑定書の章立て】（この順番・この見出しで書く）');
  CHAPTERS[k.door].forEach(([h,d])=>L.push(`【${h}】${d}`));
  L.push('');
  L.push('【読み方】');
  L.push('ここに書かれたカードと配置だけを根拠にする。書かれていないカードや意味を創作しない');

  L.push('例：家のカードなら、マルクトでは実際の家や職場、ティファレトでは心の居場所、ケテルでは魂が還る場所として読む');

  L.push('【木のバランス】では、慈悲の柱（与える・広げる）と峻厳の柱（断つ・境界）のどちらに偏っているか、均衡の柱に何が並んでいるかを読む');
  L.push('【隠された鍵】では、ダアトのカードを、本人がまだ見えていない盲点と、悩みを越える鍵として読む');

$('kCopy').onclick = ()=>copy($('kPrompt').value, $('kPrompt'));

/* ===== 3 鑑定書を組む ===== */
function cleanAI(t){
  return t.replace(/\r/g,'')
    .replace(/^\s*#{1,6}\s*(.+)$/gm,'【$1】')
    .replace(/\*\*(.+?)\*\*/g,'$1')
    .replace(/^\s*[-*・]\s+/gm,'')
    .replace(/^\s*【\s*(.+?)\s*】\s*$/gm,'【$1】');
}
/* 文章を「見出し」「段落」のかたまりに分ける */
function blocksOf(t, withHeads){
  const out = [], lines = cleanAI(t).split('\n'); let buf = [];
  const flush = ()=>{ if(buf.length){ out.push({t:'p',s:buf.join('\n')}); buf=[]; } };
  for(const ln of lines){
    const h = ln.match(/^【(.+)】$/);
    if(withHeads && h){ flush(); out.push({t:'h',s:h[1]}); continue; }
    if(!ln.trim()){ flush(); continue; }
    buf.push(ln.trim());
  }
  flush(); return out;
}
const pHTML = s => `<p>${esc(s).replace(/\n/g,'<br>')}</p>`;

/* 木を画像にする（PDFでもきれいに出るように） */
function treeImg(){
  let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" width="640" height="940"><defs>';
  for(const key in SEPH){const S=SEPH[key];
    s += `<radialGradient id="g-${key}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${S.light}"/><stop offset="1" stop-color="${S.color}"/></radialGradient>`;}
  s += '<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter></defs>';
  s += PATHS.map(([a,b])=>`<line stroke="rgba(232,196,106,.3)" stroke-width="1.2" x1="${SEPH[a].x}" y1="${SEPH[a].y}" x2="${SEPH[b].x}" y2="${SEPH[b].y}"/>`).join('');
  const seq = k.order.filter(x=>x!=='daath'), col = DOOR[k.door].color;
  for(let i=0;i<seq.length-1;i++){const A=SEPH[seq[i]],B=SEPH[seq[i+1]];
    s += `<line stroke="${col}" stroke-opacity=".8" stroke-width="2.2" stroke-linecap="round" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;}
  for(const key in SEPH){const S=SEPH[key], n=k.placed[key];
    s += `<g transform="translate(${S.x} ${S.y})"><circle r="27" fill="${S.light}" opacity=".3" filter="url(#gl)"/>
      <circle r="19" fill="url(#g-${key})" stroke="rgba(255,241,194,.7)" stroke-width="1"${key==='daath'?' stroke-dasharray="3 3"':''}/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.7)" stroke-width="3" paint-order="stroke" font-family="serif">${n}</text>
      <text y="33" text-anchor="middle" font-size="11" fill="#efe7d6" font-family="serif">${S.name}</text></g>`;}
  s += '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}

function newPage(no){
  const pg = document.createElement('div'); pg.className = 'page';
  pg.innerHTML = `<div class="frame"></div><div class="inner"></div><div class="folio">${no}</div>`;
  return pg;
}
/* ページに流し込む：入りきらなければ次のページへ */
function buildPages(){
  const D = DOOR[k.door];
  const d = new Date(), ds = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const box = $('capture'); box.innerHTML = '';
  const pages = []; let no = 1;
  let pg = newPage(no); box.appendChild(pg); pages.push(pg);
  let inner = pg.querySelector('.inner');
  const cards = k.order.map(s=>{const c=card(k.placed[s]);
    return `<div class="sh-card"><div class="im"><img src="${imgOf(c[0])}" alt=""></div>
      <div class="sp">${SEPH[s].name}</div><div>${c[0]} ${c[1]}</div></div>`;}).join('');
  inner.innerHTML = `
    <div class="sh-eyebrow">TREE OF LIFE × LENORMAND</div>
    <div class="sh-title">生命の木 鑑定書</div>
    ${k.name ? `<div class="sh-for">${esc(k.name)} 様</div>` : ''}
    <dl class="sh-meta"><dt>ご相談</dt><dd>${esc(k.worry)}</dd><dt>扉</dt><dd>${D.name}</dd><dt>鑑定日</dt><dd>${ds}</dd></dl>
    <div class="sh-tree"><img src="${treeImg()}" alt=""></div>
    <div class="sh-cards">${cards}</div>
    <div class="sh-sep">✦ ✦ ✦</div>`;

  /* 本文のかたまり（見出しは次の段落とくっつけて離さない） */
  const ai = blocksOf($('aiText').value, true), html = [];
  if(!ai.length) html.push(`<div class="blk"><p class="empty">ここに鑑定文が入ります</p></div>`);
  for(let i=0;i<ai.length;i++){
    if(ai[i].t==='h'){
      const nx = ai[i+1] && ai[i+1].t==='p' ? pHTML(ai[++i].s) : '';
      html.push(`<div class="blk"><h3>${esc(ai[i - (nx?1:0)].s)}</h3>${nx}</div>`);
    }else html.push(`<div class="blk">${pHTML(ai[i].s)}</div>`);
  }
  const adv = blocksOf($('advice').value, false);
  html.push(`<div class="blk"><section class="sh-advice"><h3>結からのアドバイス</h3>${adv.length ? adv.map(b=>pHTML(b.s)).join('') : '<p class="empty">ここに結からのアドバイスが入ります</p>'}</section></div>`);
  html.push(`<div class="blk"><p style="margin-top:18px;font-size:11.5px;text-align:center;color:var(--sub)">この鑑定書は、AIが読み解いたところから、結が詰まりをほどいていく形でお作りしています。</p><div class="sh-sign">結ゆう<small>YUU</small></div></div>`);

  const limit = () => inner.clientHeight;
  for(const h of html){
    const tmp = document.createElement('div'); tmp.innerHTML = h; const el = tmp.firstElementChild;
    inner.appendChild(el);
    if(inner.scrollHeight > limit() + 1){
      inner.removeChild(el);
      pg = newPage(++no); box.appendChild(pg); pages.push(pg);
      inner = pg.querySelector('.inner');
      inner.appendChild(el);
      const h3 = el.querySelector('h3'); if(h3 && !el.querySelector('.sh-advice')) h3.style.marginTop = '0';
    }
  }
  return pages;
}

async function renderPreview(){
  await document.fonts.ready;
  const pages = buildPages();
  await Promise.all([...$('capture').querySelectorAll('img')].map(im=>im.complete ? 0 : new Promise(r=>{im.onload=im.onerror=r;})));
  const pv = $('preview'); pv.innerHTML = '';
  const w = Math.min(pv.clientWidth || 794, 794), sc = w/794;
  pages.forEach(p=>{
    const wrap = document.createElement('div'); wrap.className = 'pv';
    wrap.style.width = w+'px'; wrap.style.height = Math.round(1123*sc)+'px';
    const c = p.cloneNode(true); c.style.transform = `scale(${sc})`;
    wrap.appendChild(c); pv.appendChild(wrap);
  });
  return pages;
}
$('previewBtn').onclick = async ()=>{
  k.name = $('inName').value.trim();
  await renderPreview(); resetPdf();
  $('stepPdf').classList.remove('hidden');
  $('preview').scrollIntoView({behavior:'smooth'});
};

/* ===== 4 PDF ===== */
let pdfBlob = null;
function fileName(){ const d=new Date(); return `生命の木鑑定書_${k.name?k.name+'様_':''}${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.pdf`; }
function resetPdf(){ pdfBlob = null; $('sharePdf').classList.add('hidden'); $('dlPdf').classList.add('hidden'); $('pdfMsg').textContent=''; }
$('makePdf').onclick = async ()=>{
  const btn = $('makePdf'); btn.disabled = true; $('pdfMsg').textContent = 'PDFを作っています…';
  try{
    k.name = $('inName').value.trim();
    const pages = await renderPreview();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){
      const cv = await html2canvas(pages[i],{scale:2,backgroundColor:'#04050d',useCORS:true,logging:false});
      if(i>0) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',0.86),'JPEG',0,0,210,297);
    }
    pdfBlob = pdf.output('blob');
    const f = new File([pdfBlob], fileName(), {type:'application/pdf'});
    const canShare = navigator.canShare && navigator.canShare({files:[f]});
    $('sharePdf').classList.toggle('hidden', !canShare);
    $('dlPdf').classList.remove('hidden');
    $('pdfMsg').textContent = `できました（${pages.length}ページ）`;
  }catch(e){
    $('pdfMsg').textContent = 'PDFを作れませんでした：' + e.message;
  }finally{ btn.disabled = false; }
};
$('sharePdf').onclick = async ()=>{
  if(!pdfBlob) return;
  try{ await navigator.share({files:[new File([pdfBlob], fileName(), {type:'application/pdf'})]}); }catch(e){}
};
$('dlPdf').onclick = ()=>{
  if(!pdfBlob) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(pdfBlob); a.download = fileName();
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000);
};

function copy(text, box){
  const done = ()=>toast('コピーしました');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fb); } else fb();
  function fb(){ box.removeAttribute('readonly'); box.select(); try{document.execCommand('copy');done();}catch(e){toast('選んでコピーしてください');} box.setAttribute('readonly',''); }
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
