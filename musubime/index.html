<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>むすびめ</title><style>:root{--ink:#f5efe7;--muted:#d8ccbf;--gold:#d9b56f;--red:#cf706d;--night:#101824;--night2:#17263a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 72% 8%,rgba(246,223,173,.15),transparent 18%),linear-gradient(180deg,var(--night2),var(--night));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{overflow-x:hidden}.app{max-width:620px;min-height:100dvh;margin:auto;padding:18px 14px calc(24px + env(safe-area-inset-bottom))}.screen{display:none;min-height:calc(100dvh - 42px);align-items:center}.screen.on{display:flex}.card{width:100%;padding:24px 18px;border-radius:30px;background:linear-gradient(180deg,rgba(255,250,242,.10),rgba(255,250,242,.035));border:1px solid rgba(255,236,201,.13);box-shadow:0 18px 55px rgba(0,0,0,.25);text-align:center;backdrop-filter:blur(8px)}.moon{width:112px;height:112px;border-radius:50%;margin:8px auto 18px;background:radial-gradient(circle at 35% 30%,#fff9ea,#efd9a6 46%,#cba25f);box-shadow:0 0 35px rgba(240,215,161,.34)}.title{font-size:44px;font-weight:800;letter-spacing:.12em}.sub,.tiny{color:var(--muted);line-height:1.8}.sub{font-size:14px}.tiny{font-size:12px}.line{width:76%;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,rgba(240,215,161,.9),transparent)}button{border:0;border-radius:18px;padding:14px;font:inherit;font-weight:800}.primary{width:100%;background:linear-gradient(180deg,#f2dfb8,#d8b06a);color:#231c14}.prompt{font-size:21px;line-height:1.85;margin:25px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}.stat{padding:9px 6px;border-radius:16px;background:rgba(255,248,237,.07);border:1px solid rgba(255,236,201,.12);text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}.timer{height:9px;background:rgba(255,248,237,.1);border-radius:99px;overflow:hidden;margin-bottom:11px}.bar{height:100%;width:100%;background:linear-gradient(90deg,#c99554,#efd69b)}.board{padding:8px;border-radius:22px;background:rgba(7,11,17,.18);border:1px solid rgba(255,236,201,.1)}canvas{display:block;width:100%;aspect-ratio:1;border-radius:18px;touch-action:none;background:radial-gradient(circle at 50% 14%,rgba(240,215,161,.06),transparent 24%),linear-gradient(180deg,rgba(19,31,48,.92),rgba(8,13,20,.95))}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.item{background:rgba(255,248,237,.07);border:1px solid rgba(255,236,201,.12);color:var(--ink);font-size:12px;padding:10px 4px}.item:disabled{opacity:.32}.item small{display:block;color:var(--muted);margin-top:2px}.msg{min-height:38px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding-top:9px}.reflect h2{font-size:38px;margin:4px 0 18px}.reflect p{font-size:17px;line-height:2}.reward{padding:10px;border-radius:15px;border:1px solid rgba(255,236,201,.11);background:rgba(255,248,237,.06);color:#f0d7a1;margin:10px 0 14px}.choices{display:grid;gap:8px;margin:18px 0}.choice{width:100%;text-align:left;background:rgba(255,248,237,.07);border:1px solid rgba(255,236,201,.12);color:var(--ink)}.choice.sel{outline:2px solid var(--gold)}</style></head><body><div class="app"><section id="title" class="screen on"><div class="card"><div class="moon"></div><div class="title">むすびめ</div><p class="sub">あなたの心の結び目は、どうやって解く？</p><div class="line"></div><p class="tiny">絡まる想いを、ほどいていく。<br>それは、きっと、わたしを知る旅。</p><button id="start" class="primary">第一章「我慢」をはじめる</button></div></section><section id="story" class="screen"><div class="card"><p class="tiny">第一章　我慢</p><h2 id="storyTitle"></h2><div class="line"></div><div id="storyPrompt" class="prompt"></div><p id="storyGuide" class="sub"></p><button id="toGame" class="primary">結び目に触れる</button></div></section><section id="game" class="screen"><div style="width:100%"><div class="stats"><div class="stat"><b id="stageN">1</b><small>STAGE</small></div><div class="stat"><b id="crossN">0</b><small>交差</small></div><div class="stat"><b id="timeN">60</b><small>秒</small></div></div><div class="timer"><div id="bar" class="bar"></div></div><div class="board"><canvas id="cv" width="900" height="900"></canvas></div><div class="items"><button id="breath" class="item">🌿 深呼吸<small>＋10秒 × <b id="bc">2</b></small></button><button id="insight" class="item">💡 気づき<small>ひとつ導く × <b id="ic">2</b></small></button><button id="still" class="item">⌛ 静止<small>5秒停止 × <b id="sc">1</b></small></button></div><div id="msg" class="msg">ぐちゃっと絡まった糸を、赤い交差がなくなるまでほどいて。</div></div></section><section id="reflect" class="screen"><div class="card reflect"><h2>ほどけた。</h2><p id="reflection"></p><div id="reward" class="reward"></div><button id="next" class="primary">次へ</button></div></section><section id="ending" class="screen"><div class="card"><p class="tiny">第一章　我慢 — おわり</p><h2>今のあなたに近いものは？</h2><div class="choices"><button class="choice">言わずに飲み込むことが多い</button><button class="choice">相手を優先してしまう</button><button class="choice">最近は少し言えるようになった</button><button class="choice">まだ、よく分からない</button></div><p class="sub">我慢は、誰かを守るために身につけたのかもしれません。<br><b>でも、今も必要ですか？</b></p><button id="finish" class="primary" disabled>第一章を閉じる</button></div></section><section id="done" class="screen"><div class="card"><div class="moon" style="width:86px;height:86px"></div><h2>第一章をほどきました。</h2><p class="prompt">ほどけた先に、<br>きっと、わたしがいる。</p><p class="tiny">答えを出さなくていい。<br>気づいたことだけ、持って帰ってください。</p><button id="again" class="primary">もう一度遊ぶ</button></div></section></div><script>const S=[{t:'小さな我慢',q:'最近、「まあいいか」と飲み込んだことは？',g:'まずは、小さな我慢から。',r:'言わなかった言葉も、心の中には残っています。',rw:'ごほうび：気づき ×1',rt:'i',sec:62,home:[[150,250],[350,170],[600,190],[760,360],[700,640],[430,735],[180,610]],start:[[365,300],[530,320],[315,470],[585,500],[400,590],[520,620],[455,430]],edges:[[0,1],[0,3],[0,5],[1,2],[1,4],[1,6],[2,3],[2,5],[3,4],[3,6],[4,5],[5,6]]},{t:'遠慮',q:'誰かを困らせないために、自分を後回しにしていない？',g:'相手を守ることと、自分を消すことは違う。',r:'やさしさと我慢は、似ているけれど同じではありません。',rw:'ごほうび：深呼吸 ×1',rt:'b',sec:78,home:[[130,220],[360,130],[620,160],[790,340],[770,610],[560,760],[300,770],[100,590],[300,420]],start:[[395,250],[545,280],[305,360],[595,390],[330,500],[560,520],[400,620],[510,660],[455,430]],edges:[[0,1],[0,7],[0,8],[1,2],[1,8],[2,3],[2,8],[3,4],[3,8],[4,5],[4,8],[5,6],[5,8],[6,7],[6,8],[7,8],[0,4],[2,6]]},{t:'本音',q:'「嫌」と言う代わりに、笑っていませんか？',g:'最後は、少しだけ深い結び目。',r:'本音は、誰かを傷つけるためではなく、自分を守るためにもあります。',rw:'ごほうび：静止 ×1',rt:'s',sec:95,home:[[100,230],[300,120],[535,120],[750,225],[815,450],[720,690],[510,790],[270,760],[90,610],[340,430],[590,430]],start:[[390,220],[550,250],[305,320],[610,345],[335,430],[585,455],[360,545],[560,575],[425,665],[470,390],[470,520]],edges:[[0,1],[0,8],[0,9],[1,2],[1,9],[2,3],[2,10],[3,4],[3,10],[4,5],[4,10],[5,6],[5,10],[6,7],[6,9],[7,8],[7,9],[8,9],[9,10],[0,5],[2,7],[1,6]]}],$=id=>document.getElementById(id),screens=['title','story','game','reflect','ending','done'];let st=0,items={b:2,i:2,s:1},nodes=[],home=[],edges=[],drag=-1,t=60,max=60,timer,frozen=false,ended=false,rough=[];function show(x){screens.forEach(y=>$(y).classList.toggle('on',x===y));scrollTo(0,0)}function story(){let s=S[st];$('storyTitle').textContent=s.t;$('storyPrompt').textContent=s.q;$('storyGuide').textContent=s.g;show('story')}function orient(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}function hit(a,b,c,d){let a1=orient(a,b,c),a2=orient(a,b,d),a3=orient(c,d,a),a4=orient(c,d,b),e=.001;if(Math.abs(a1)<e||Math.abs(a2)<e||Math.abs(a3)<e||Math.abs(a4)<e)return false;return(a1>0)!=(a2>0)&&(a3>0)!=(a4>0)}function crossData(){let bad=new Set(),count=0;for(let i=0;i<edges.length;i++){let[a,b]=edges[i];for(let j=i+1;j<edges.length;j++){let[c,d]=edges[j];if(a===c||a===d||b===c||b===d)continue;if(hit(nodes[a],nodes[b],nodes[c],nodes[d])){bad.add(i);bad.add(j);count++}}}return{bad,count}}const cv=$('cv'),ctx=cv.getContext('2d');function seedRough(){rough=edges.map((e,i)=>{let s=(i+1)*91+(st+2)*137;const r=n=>(((Math.sin(s+n*12.9898)*43758.5453)%1)+1)%1;return{bend:(r(1)-.5)*34,w1:(r(2)-.5)*8,w2:(r(3)-.5)*12,w3:(r(4)-.5)*6}})}function strand(a,b,r,bad,pass){let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let wig=pass===0?r.w1:pass===1?r.w2:r.w3;ctx.beginPath();ctx.moveTo(a.x+nx*wig,b.y? a.y+ny*wig:a.y);ctx.quadraticCurveTo(mx+nx*(r.bend+wig*2),my+ny*(r.bend+wig*2),b.x+nx*wig,b.y+ny*wig);ctx.lineCap='round';ctx.lineWidth=pass===0?10:pass===1?4:2;ctx.strokeStyle=bad?(pass===0?'rgba(192,83,80,.78)':pass===1?'rgba(232,132,128,.45)':'rgba(255,210,205,.25)'):(pass===0?'rgba(200,159,92,.74)':pass===1?'rgba(239,209,151,.44)':'rgba(255,246,223,.24)');ctx.stroke()}function draw(){ctx.clearRect(0,0,900,900);ctx.beginPath();ctx.arc(690,150,72,0,Math.PI*2);ctx.fillStyle='rgba(240,215,161,.07)';ctx.fill();let{bad,count}=crossData();$('crossN').textContent=count;edges.forEach((e,i)=>{let[a,b]=e;strand(nodes[a],nodes[b],rough[i],bad.has(i),0);strand(nodes[a],nodes[b],rough[i],bad.has(i),1);strand(nodes[a],nodes[b],rough[i],bad.has(i),2)});nodes.forEach((p,i)=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate((i%3-1)*.16);ctx.beginPath();ctx.ellipse(0,0,24,20,0,0,Math.PI*2);ctx.fillStyle='#d0ad6e';ctx.fill();ctx.beginPath();ctx.ellipse(0,0,10,8,0,0,Math.PI*2);ctx.fillStyle='#fff4dc';ctx.fill();ctx.restore()});if(count===0&&!ended)win()}function ui(){$('timeN').textContent=Math.max(0,Math.ceil(t));$('bar').style.width=Math.max(0,100*t/max)+'%';$('bc').textContent=items.b;$('ic').textContent=items.i;$('sc').textContent=items.s;$('breath').disabled=!items.b;$('insight').disabled=!items.i;$('still').disabled=!items.s||frozen}function game(){clearInterval(timer);let s=S[st];ended=false;frozen=false;max=t=s.sec;home=s.home.map(([x,y])=>({x,y}));nodes=s.start.map(([x,y])=>({x,y}));edges=s.edges.map(x=>x.slice());seedRough();$('stageN').textContent=st+1;$('msg').textContent='ぐちゃっと絡まった糸を、赤い交差がなくなるまでほどいて。';show('game');ui();draw();timer=setInterval(()=>{if(ended||frozen)return;t-=.1;if(t<=0){t=0;clearInterval(timer);ended=true;$('msg').textContent='時間切れ。結び目は逃げない。もう一度。';setTimeout(game,1200)}ui()},100)}function win(){ended=true;clearInterval(timer);let s=S[st];items[s.rt]++;$('reflection').textContent=s.r;$('reward').textContent=s.rw;$('next').textContent=st===2?'第一章を振り返る':'次の結び目へ';$('msg').textContent='ほどけた。';let from=nodes.map(p=>({...p})),start=performance.now();function morph(now){let p=Math.min(1,(now-start)/850),e=1-Math.pow(1-p,3);nodes=from.map((q,i)=>({x:q.x+(home[i].x-q.x)*e,y:q.y+(home[i].y-q.y)*e}));draw();if(p<1)requestAnimationFrame(morph);else setTimeout(()=>show('reflect'),220)}requestAnimationFrame(morph)}function point(x,y){let r=cv.getBoundingClientRect();return{x:(x-r.left)*900/r.width,y:(y-r.top)*900/r.height}}function down(x,y){if(ended)return;let p=point(x,y),best=55;drag=-1;nodes.forEach((n,i)=>{let d=Math.hypot(n.x-p.x,n.y-p.y);if(d<best){best=d;drag=i}})}function move(x,y){if(drag<0||ended)return;let p=point(x,y);nodes[drag].x=Math.max(35,Math.min(865,p.x));nodes[drag].y=Math.max(35,Math.min(865,p.y));draw()}cv.addEventListener('touchstart',e=>{e.preventDefault();let q=e.touches[0];down(q.clientX,q.clientY)},{passive:false});cv.addEventListener('touchmove',e=>{e.preventDefault();let q=e.touches[0];move(q.clientX,q.clientY)},{passive:false});cv.addEventListener('touchend',e=>{e.preventDefault();drag=-1},{passive:false});cv.onmousedown=e=>down(e.clientX,e.clientY);cv.onmousemove=e=>move(e.clientX,e.clientY);onmouseup=()=>drag=-1;$('start').onclick=story;$('toGame').onclick=game;$('next').onclick=()=>{if(st<2){st++;story()}else show('ending')};$('breath').onclick=()=>{if(items.b){items.b--;t+=10;max=Math.max(max,t);$('msg').textContent='深呼吸。10秒ぶん、余白が戻った。';ui()}};$('insight').onclick=()=>{if(items.i){items.i--;let k=0,d=-1;nodes.forEach((p,i)=>{let z=Math.hypot(p.x-home[i].x,p.y-home[i].y);if(z>d){d=z;k=i}});nodes[k]={...home[k]};$('msg').textContent='気づき。ひとつだけ、本来の居場所へ。';ui();draw()}};$('still').onclick=()=>{if(items.s&&!frozen){items.s--;frozen=true;$('msg').textContent='静止。5秒だけ、急がなくていい。';ui();setTimeout(()=>{frozen=false;$('msg').textContent='時間がまた動き出した。';ui()},5000)}};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('finish').disabled=false});$('finish').onclick=()=>show('done');$('again').onclick=()=>{st=0;items={b:2,i:2,s:1};story()};</script></body></html>
