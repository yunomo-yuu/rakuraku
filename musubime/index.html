<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>むすびめ</title><style>:root{--paper:#fffaf2;--bg:#efe5d8;--ink:#292622;--muted:#756a60;--gold:#b58a4d;--red:#b85f5c;--green:#5e7564}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff9ef,#eadfce);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:600px;min-height:100dvh;margin:auto;padding:16px 14px 28px}.screen{display:none;min-height:calc(100dvh - 44px);align-items:center}.screen.on{display:flex}.card{width:100%;background:rgba(255,250,242,.94);border:1px solid #dfd1bd;border-radius:26px;padding:24px 18px;box-shadow:0 15px 40px #4b39241c;text-align:center}.moon{width:110px;height:110px;border-radius:50%;margin:8px auto 20px;background:radial-gradient(circle at 35% 30%,#fff8d9,#e4c584);box-shadow:0 0 32px #e6c78170}.title{font-size:46px;font-weight:800;letter-spacing:.08em}.sub{color:var(--muted);line-height:1.8;font-size:14px}.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto;width:72%}button{border:0;border-radius:16px;padding:13px 14px;font-weight:800;font-size:15px}.primary{width:100%;background:#283036;color:#fff}.story h2{font-size:29px;margin:8px}.prompt{font-size:21px;line-height:1.8;margin:26px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.stat{background:var(--paper);border:1px solid #e0d3c2;border-radius:14px;padding:8px}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}.timer{height:8px;background:#e6d8c6;border-radius:99px;overflow:hidden;margin-bottom:9px}.bar{height:100%;background:linear-gradient(90deg,var(--gold),#78806c);width:100%}canvas{display:block;width:100%;aspect-ratio:1;background:#fffaf2;border:1px solid #e1d5c3;border-radius:18px;touch-action:none}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.item{background:#fffaf2;border:1px solid #dbc49b;color:var(--ink);font-size:12px;padding:10px 4px}.msg{min-height:38px;color:var(--muted);font-size:12px;padding-top:9px}.reflect h2{font-size:37px}.reflect p{font-size:17px;line-height:2}.choices{display:grid;gap:8px;margin:18px 0}.choice{background:#fffaf2;border:1px solid #decfbb;color:var(--ink);text-align:left}.choice.sel{outline:2px solid var(--gold)}.tiny{color:var(--muted);font-size:12px;line-height:1.7}</style></head><body><div class="app"><section id="title" class="screen on"><div class="card"><div class="moon"></div><div class="title">むすびめ</div><p class="sub">あなたの心の結び目は、どうやって解く？</p><div class="line"></div><p class="tiny">絡まる想いを、ほどいていく。<br>それは、きっと、わたしを知る旅。</p><button id="start" class="primary">第一章「我慢」をはじめる</button></div></section><section id="story" class="screen"><div class="card story"><div class="tiny">第一章　我慢</div><h2 id="storyTitle"></h2><div class="line"></div><div id="storyPrompt" class="prompt"></div><p id="storyGuide" class="sub"></p><button id="toGame" class="primary">結び目に触れる</button></div></section><section id="game" class="screen"><div style="width:100%"><div class="stats"><div class="stat"><b id="stageN">1</b><small>STAGE</small></div><div class="stat"><b id="crossN">0</b><small>交差</small></div><div class="stat"><b id="timeN">45</b><small>秒</small></div></div><div class="timer"><div id="bar" class="bar"></div></div><canvas id="cv" width="900" height="900"></canvas><div class="items"><button id="breath" class="item">🌿 深呼吸<br><span id="bc">2</span></button><button id="insight" class="item">💡 気づき<br><span id="ic">2</span></button><button id="still" class="item">⌛ 静止<br><span id="sc">1</span></button></div><div id="msg" class="msg">丸を動かして、赤い糸の交差をゼロにしてね。</div></div></section><section id="reflect" class="screen"><div class="card reflect"><h2>ほどけた。</h2><p id="reflection"></p><div class="line"></div><p id="reward" class="tiny"></p><button id="next" class="primary">次へ</button></div></section><section id="ending" class="screen"><div class="card"><div class="tiny">第一章　我慢 — おわり</div><h2>今のあなたに近いものは？</h2><div class="choices"><button class="choice">言わずに飲み込むことが多い</button><button class="choice">相手を優先してしまう</button><button class="choice">最近は少し言えるようになった</button><button class="choice">まだ、よく分からない</button></div><p class="sub">我慢は、誰かを守るために身につけたのかもしれません。<br><b>でも、今も必要ですか？</b></p><button id="finish" class="primary" disabled>第一章を閉じる</button></div></section><section id="done" class="screen"><div class="card"><div class="moon" style="width:85px;height:85px"></div><h2>第一章をほどきました。</h2><p class="prompt">ほどけた先に、<br>きっと、わたしがいる。</p><p class="tiny">答えを出さなくていい。<br>気づいたことだけ、持って帰ってください。</p><button id="again" class="primary">もう一度遊ぶ</button></div></section></div><script>const S=[{t:"小さな我慢",q:"最近、『まあいいか』と飲み込んだことは？",g:"まずは、小さな我慢から。",r:"言わなかった言葉も、心の中には残っています。",rw:"気づき ×1",rt:"i",sec:52,n:5},{t:"遠慮",q:"誰かを困らせないために、自分を後回しにしていない？",g:"相手を守ることと、自分を消すことは違う。",r:"やさしさと我慢は、似ているけれど同じではありません。",rw:"深呼吸 ×1",rt:"b",sec:46,n:6},{t:"本音",q:"『嫌』と言う代わりに、笑っていませんか？",g:"最後は、少しだけ深い結び目。",r:"本音は、誰かを傷つけるためではなく、自分を守るためにもあります。",rw:"静止 ×1",rt:"s",sec:40,n:7}],$=x=>document.getElementById(x),screens=["title","story","game","reflect","ending","done"];let st=0,items={b:2,i:2,s:1},nodes=[],home=[],edges=[],drag=-1,t=45,max=45,timer,frozen=false,ended=false;function show(x){screens.forEach(y=>$(y).classList.toggle("on",x===y));scrollTo(0,0)}function story(){let s=S[st];$("storyTitle").textContent=s.t;$("storyPrompt").textContent=s.q;$("storyGuide").textContent=s.g;show("story")}function mkHome(n){let a=[],cx=450,cy=450,r=300;for(let i=0;i<n;i++){let z=-Math.PI/2+i*Math.PI*2/n;a.push({x:cx+Math.cos(z)*r,y:cy+Math.sin(z)*r})}a.push({x:450,y:450});return a}function mkEdges(n){let e=[];for(let i=0;i<n;i++)e.push([i,(i+1)%n]);for(let i=0;i<n;i++)e.push([i,n]);return e}function scramble(h,n){let p=[...Array(n).keys()].map(i=>(i+2+st)%n);p.push(n);let k=(st*2+1)%n;[p[k],p[n]]=[p[n],p[k]];return p.map(j=>({...h[j]}))}function o(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}function hit(a,b,c,d){let a1=o(a,b,c),a2=o(a,b,d),a3=o(c,d,a),a4=o(c,d,b);return(a1>0)!=(a2>0)&&(a3>0)!=(a4>0)}function crosses(){let bad=new Set,count=0;for(let i=0;i<edges.length;i++){let[a,b]=edges[i];for(let j=i+1;j<edges.length;j++){let[c,d]=edges[j];if(a===c||a===d||b===c||b===d)continue;if(hit(nodes[a],nodes[b],nodes[c],nodes[d])){bad.add(i);bad.add(j);count++}}}return{bad,count}}const cv=$("cv"),ctx=cv.getContext("2d");function draw(){ctx.clearRect(0,0,900,900);let{bad,count}=crosses();$("crossN").textContent=count;edges.forEach((e,i)=>{let[a,b]=e;ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y);ctx.lineWidth=14;ctx.lineCap="round";ctx.strokeStyle=bad.has(i)?"#b85f5ccc":"#5e7564c7";ctx.stroke()});nodes.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,34,0,Math.PI*2);ctx.fillStyle="#fffaf2";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#b58a4d";ctx.stroke();ctx.fillStyle="#292622";ctx.font="700 24px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(i+1,p.x,p.y)});if(!count&&!ended)win()}function ui(){$("timeN").textContent=Math.max(0,Math.ceil(t));$("bar").style.width=Math.max(0,100*t/max)+"%";$("bc").textContent=items.b;$("ic").textContent=items.i;$("sc").textContent=items.s}function game(){clearInterval(timer);let s=S[st];ended=false;frozen=false;max=t=s.sec;home=mkHome(s.n);edges=mkEdges(s.n);nodes=scramble(home,s.n);$("stageN").textContent=st+1;show("game");ui();draw();timer=setInterval(()=>{if(ended||frozen)return;t-=.1;if(t<=0){t=0;clearInterval(timer);ended=true;$("msg").textContent="時間切れ。もう一度この結び目に触れてみて。";setTimeout(game,1200)}ui()},100)}function win(){ended=true;clearInterval(timer);let s=S[st];items[s.rt]++;$("reflection").textContent=s.r;$("reward").textContent="ごほうび："+s.rw;$("next").textContent=st===2?"第一章を振り返る":"次の結び目へ";setTimeout(()=>show("reflect"),250)}function pt(x,y){let r=cv.getBoundingClientRect();return{x:(x-r.left)*900/r.width,y:(y-r.top)*900/r.height}}function down(x,y){let p=pt(x,y);drag=-1;nodes.forEach((n,i)=>{if(Math.hypot(n.x-p.x,n.y-p.y)<58)drag=i})}function move(x,y){if(drag<0||ended)return;let p=pt(x,y);nodes[drag].x=Math.max(40,Math.min(860,p.x));nodes[drag].y=Math.max(40,Math.min(860,p.y));draw()}cv.addEventListener("touchstart",e=>{e.preventDefault();let q=e.touches[0];down(q.clientX,q.clientY)},{passive:false});cv.addEventListener("touchmove",e=>{e.preventDefault();let q=e.touches[0];move(q.clientX,q.clientY)},{passive:false});cv.addEventListener("touchend",e=>{e.preventDefault();drag=-1},{passive:false});cv.onmousedown=e=>down(e.clientX,e.clientY);cv.onmousemove=e=>move(e.clientX,e.clientY);onmouseup=()=>drag=-1;$("start").onclick=story;$("toGame").onclick=game;$("next").onclick=()=>{if(st<2){st++;story()}else show("ending")};$("breath").onclick=()=>{if(items.b){items.b--;t+=10;max=Math.max(max,t);$("msg").textContent="深呼吸。10秒ぶん、余白が戻った。";ui()}};$("insight").onclick=()=>{if(items.i){items.i--;let k=0,d=-1;nodes.forEach((p,i)=>{let z=Math.hypot(p.x-home[i].x,p.y-home[i].y);if(z>d){d=z;k=i}});nodes[k]={...home[k]};$("msg").textContent="気づき。ひとつ、居場所が見えた。";ui();draw()}};$("still").onclick=()=>{if(items.s&&!frozen){items.s--;frozen=true;$("msg").textContent="静止。5秒だけ、急がなくていい。";ui();setTimeout(()=>{frozen=false;$("msg").textContent="時間がまた動き出した。"},5000)}};document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");$("finish").disabled=false});$("finish").onclick=()=>show("done");$("again").onclick=()=>{st=0;items={b:2,i:2,s:1};story()};</script></body></html>
